openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /affirmations/random:
    get:
      operationId: getRandomAffirmation
      tags: [affirmations]
      summary: Dispense a random affirmation from the editable collection
      responses:
        "200":
          description: A randomly chosen affirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affirmation"
        "503":
          description: The collection is empty or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Affirmation:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string
          minLength: 1
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

